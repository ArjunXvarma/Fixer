name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Smoke tests
        run: pytest -q

      # No API key needed: no agent runs, so this only checks that every
      # benchmark fixture is still genuinely broken and the scorer works.
      - name: Benchmark fixture check (no-op baseline)
        run: python -m fixer.eval --arch none
